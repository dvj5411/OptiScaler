name: Build (No Signing)

on:
  workflow_dispatch:
  push:
    branches:
      - warframe-no-vulkan-hooks

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Disable Vulkan w/DX12 procaddr hooks for Warframe diagnostic
      shell: powershell
      run: |
        $path = ".\OptiScaler\spoofing\Vulkan_Spoofing.cpp"
        $text = Get-Content -Path $path -Raw

        $instancePattern = '(?ms)^\s*auto result = Vulkan_wDx12::GetInstanceProcAddr\(orgFunc, pName\);\r?\n\s*if \(result != VK_NULL_HANDLE\)\r?\n\s*return result;\r?\n'
        $devicePattern = '(?ms)^\s*auto result = Vulkan_wDx12::GetDeviceProcAddr\(orgFunc, pName\);\r?\n\s*if \(result != VK_NULL_HANDLE\)\r?\n\s*return result;\r?\n'

        $instanceMatches = [regex]::Matches($text, $instancePattern).Count
        $deviceMatches = [regex]::Matches($text, $devicePattern).Count
        if ($instanceMatches -ne 1) { throw "Expected exactly one Vulkan_wDx12::GetInstanceProcAddr block, found $instanceMatches" }
        if ($deviceMatches -ne 1) { throw "Expected exactly one Vulkan_wDx12::GetDeviceProcAddr block, found $deviceMatches" }

        $text = [regex]::Replace($text, $instancePattern, "`n    // Warframe diagnostic: bypass Vulkan_wDx12::GetInstanceProcAddr.`n", 1)
        $text = [regex]::Replace($text, $devicePattern, "`n    // Warframe diagnostic: bypass Vulkan_wDx12::GetDeviceProcAddr.`n", 1)

        $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
        [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)
        Write-Host "Vulkan w/DX12 procaddr diagnostic patch applied."

    - name: Make D3D12 device Release hook transparent
      shell: powershell
      run: |
        $path = ".\OptiScaler\hooks\D3D12_Hooks.cpp"
        $text = Get-Content -Path $path -Raw

        $releasePattern = '(?ms)VALIDATE_HOOK\(hkD3D12DeviceRelease, PFN_Release\)\r?\nstatic ULONG hkD3D12DeviceRelease\(IUnknown\* device\)\r?\n\{.*?\r?\n\}\r?\n\r?\n(?=VALIDATE_HOOK\(hkCheckFeatureSupport, PFN_CheckFeatureSupport\))'
        $matches = [regex]::Matches($text, $releasePattern).Count
        if ($matches -ne 1) { throw "Expected exactly one hkD3D12DeviceRelease function, found $matches" }

        $replacement = @(
          'VALIDATE_HOOK(hkD3D12DeviceRelease, PFN_Release)'
          'static ULONG hkD3D12DeviceRelease(IUnknown* device)'
          '{'
          '    // Warframe diagnostic: transparent Release forwarder.'
          '    return o_D3D12DeviceRelease(device);'
          '}'
          ''
        ) -join "`n"

        $text = [regex]::Replace($text, $releasePattern, $replacement, 1)
        $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
        [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)
        Write-Host "Transparent D3D12 Release diagnostic patch applied."

    - name: Hard bypass D3D12 HookToDevice
      shell: powershell
      run: |
        $path = ".\OptiScaler\hooks\D3D12_Hooks.cpp"
        $text = Get-Content -Path $path -Raw

        $pattern = '(?m)^static void HookToDevice\(ID3D12Device\* InDevice\)\r?\n\{'
        $matches = [regex]::Matches($text, $pattern).Count
        if ($matches -ne 1) { throw "Expected exactly one HookToDevice definition, found $matches" }

        $replacement = @(
          'static void HookToDevice(ID3D12Device* InDevice)'
          '{'
          '    LOG_WARN("Warframe diagnostic: HookToDevice hard bypassed for device {:X}", (UINT64) InDevice);'
          '    return;'
        ) -join "`n"

        $text = [regex]::Replace($text, $pattern, $replacement, 1)
        $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
        [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)

        Write-Host "HookToDevice hard bypass applied."
        Select-String -Path $path -Pattern 'HookToDevice hard bypassed'

    - name: Hard bypass generic Vulkan hook installation
      shell: powershell
      run: |
        $path = ".\OptiScaler\dllmain.cpp"
        $text = Get-Content -Path $path -Raw

        $pattern = '(?m)^\s*LOG_DEBUG\("Hooking vulkan-1\.dll"\);\r?\n\s*VulkanHooks::Hook\(vulkanModule\);'
        $matches = [regex]::Matches($text, $pattern).Count
        if ($matches -ne 1) { throw "Expected exactly one generic VulkanHooks::Hook installation block, found $matches" }

        $replacement = '        LOG_WARN("Warframe diagnostic: generic VulkanHooks::Hook bypassed for module {:X}", (size_t) vulkanModule);'
        $text = [regex]::Replace($text, $pattern, $replacement, 1)

        $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
        [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)

        Write-Host "Generic Vulkan hook installation hard bypass applied."
        Select-String -Path $path -Pattern 'generic VulkanHooks::Hook bypassed'

    - name: Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) { throw "File not found: $resourceFile" }

        function Get-Version-Component {
            param ([string]$pattern, [string]$replacement)
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if (-Not $line) { throw "Pattern not found: $pattern" }
            return ($line.Line -replace $replacement).Trim()
        }

        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'
        $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"
        $date = Get-Date -Format "yyyyMMdd"
        $outputFileName = "OptiScaler_${version}_${date}_warframe-no-vulkan-hooks"

        Write-Output "Generated Filename: $outputFileName"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal

    - name: Compress the artifact
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r ${{ github.workspace }}\$zipName ${{ github.workspace }}\x64\Release\a\*.*

    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error
